version: '3.8'

services:
  da-engine:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - NSCBI_API_BASE_URL=${NSCBI_API_BASE_URL:-https://api.nscbiairport.com/api}
      - NSCBI_API_KEY=${NSCBI_API_KEY:-your_api_key_here}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-30}
      - DA_ENGINE_HOST=${DA_ENGINE_HOST:-0.0.0.0}
      - DA_ENGINE_PORT=${DA_ENGINE_PORT:-8001}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_WASHROOM_CAPACITY=${DEFAULT_WASHROOM_CAPACITY:-10}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
      - WHI_HISTORY_BUFFER_SIZE=${WHI_HISTORY_BUFFER_SIZE:-100}
      - CORS_ALLOW_ORIGIN=http://localhost:3000
      - REDIS_HOST=washroom-redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - REDIS_PASSWORD=35d917a9b4e47447f2ec4b6ec3944e51
      - WMS_PG_HOST=washroom-timescaledb
      - WMS_PG_PORT=5432
      - WMS_PG_DB=washroom_db
      - WMS_PG_USER=postgres
      - WMS_PG_PASSWORD=6cdab6f3d5270c9739ba920d3e0b2016
    restart: always
    networks:
      - data

networks:
  data:
    name: data
    external: true
