<!-- Wazuh Agent Configuration for AAI WMS Host -->
<ossec_config>
  <!-- File Integrity Monitoring (Syscheck) -->
  <syscheck>
    <!-- Frequency of syscheck scan in seconds -->
    <frequency>43200</frequency>
    
    <!-- Monitor changes in the critical config files and cert directories (using absolute host-side paths) -->
    <directories check_all="yes" realtime="yes">/opt/aai-wms/certs</directories>
    <file check_all="yes" realtime="yes">/opt/aai-wms/emqx/acl.json</file>
    <file check_all="yes" realtime="yes">/opt/aai-wms/haproxy/haproxy.cfg</file>
    <file check_all="yes" realtime="yes">/opt/aai-wms/db_init/01-init.sql</file>

    <!-- Do not alert on common ignored directories -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
  </syscheck>

  <!-- Log Ingestion (Localfile) -->
  
  <!-- FastAPI Application Log Ingestion -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/aai-wms/fastapi/fastapi.log</location>
  </localfile>

  <!-- TimescaleDB / Postgres Log Ingestion -->
  <localfile>
    <log_format>postgresql</log_format>
    <location>/var/log/aai-wms/postgres/postgresql.log</location>
  </localfile>

  <!-- EMQX Log Ingestion -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/aai-wms/emqx/emqx.log</location>
  </localfile>

  <!-- Certificate Monitor Expiry Log Ingestion -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/aai-wms/certs/monitor.log</location>
  </localfile>

  <!-- Active Response Configuration -->
  
  <!-- Active Response Command definition -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response Trigger when rule level 12 (Critical MQTT Failures) fires -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <level>12</level>
    <timeout>600</timeout> <!-- Block offending IP for 10 minutes -->
  </active-response>
</ossec_config>
