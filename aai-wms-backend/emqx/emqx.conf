## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = static
  static {
    seeds = ["emqx1@emqx1", "emqx2@emqx2", "emqx3@emqx3"]
  }
}

dashboard {
    listeners {
        http.bind = 18083
    }
}

# EMQX Configuration for SSL-only (mTLS) & Payload Limits

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile   = "/opt/emqx/etc/certs/emqx-server.crt"
    keyfile    = "/opt/emqx/etc/certs/emqx-server.key"
    verify     = verify_peer
    fail_if_no_peer_cert = true
    versions   = ["tlsv1.3", "tlsv1.2"]
  }
}

# Disable the plaintext 1883 listener entirely
listeners.tcp.default.enabled = false

# Disable unused WebSocket listeners
listeners.ws.default.enabled = false
listeners.wss.default.enabled = false

# Cap maximum MQTT packet size to 64KB (prevent huge payload DoS)
mqtt {
  max_packet_size = 64KB
  peer_cert_as_username = "cn"
}

# Configure file-based ACL
authorization {
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.json"
    }
  ]
}
