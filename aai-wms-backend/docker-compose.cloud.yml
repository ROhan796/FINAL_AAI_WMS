# ══════════════════════════════════════════════════════════════
# Docker Compose — Hostinger VPS HAProxy
# Deploy with: docker-compose -f docker-compose.cloud.yml up -d
# ══════════════════════════════════════════════════════════════

services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy-cloud
    restart: unless-stopped
    ports:
      - "8883:8883"    # MQTT over SSL
      - "18083:18083"  # EMQX Dashboard
      - "443:443"      # FastAPI
      - "8001:8001"    # DA Engine
      - "8080:8080"    # Health check
    volumes:
      - ./haproxy/haproxy-cloud.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/haproxy:/etc/haproxy/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
