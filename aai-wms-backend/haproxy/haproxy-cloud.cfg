# ══════════════════════════════════════════════════════════════
# HAProxy Cloud Configuration
# Points to: EMQX Cloud, Render WMS Backend, Render DA Engine
# ══════════════════════════════════════════════════════════════

global
    log stdout format raw local0
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    timeout connect 10s
    timeout client  100s
    timeout server  100s
    option  tcplog
    option  dontlognull
    retries 3

# ─────────────────────────────────────────────────────────────
# MQTT SSL (8883) — TCP pass-through to EMQX Cloud
# ─────────────────────────────────────────────────────────────
frontend mqtt_ssl_front
    bind *:8883
    mode tcp
    default_backend mqtt_ssl_back

backend mqtt_ssl_back
    mode tcp
    balance roundrobin
    option ssl-hello-chk
    server emqx-cloud ke1040ef.ala.us-east-1.emqxsl.com:8883 check inter 5s fall 3 rise 2

# ─────────────────────────────────────────────────────────────
# EMQX Dashboard SSL (18083) — HTTP to EMQX Cloud Dashboard
# ─────────────────────────────────────────────────────────────
frontend dashboard_front
    mode http
    bind *:18083 ssl crt /etc/haproxy/certs/api.pem
    default_backend dashboard_back

backend dashboard_back
    mode http
    balance roundrobin
    option httpchk GET /status
    http-check expect status 200
    server emqx-dash ke1040ef.ala.us-east-1.emqxsl.com:18083 check inter 10s

# ─────────────────────────────────────────────────────────────
# FastAPI API HTTPS (443) — HTTP to Render WMS Backend
# ─────────────────────────────────────────────────────────────
frontend api_https_front
    mode http
    bind *:443 ssl crt /etc/haproxy/certs/api.pem
    acl is_websocket hdr(Upgrade) -i websocket
    http-request set-header X-Forwarded-Proto https
    use_backend fastapi_backend if is_websocket
    default_backend fastapi_backend

backend fastapi_backend
    mode http
    balance roundrobin
    timeout tunnel 3600s
    timeout server 100s
    option httpchk GET /health
    http-check expect status 200
    http-request set-header X-Forwarded-Proto https
    # Replace YOUR_RENDER_WMS_URL with your actual Render WMS Backend URL
    # e.g., server fastapi your-wms-backend.onrender.com:443 check ssl verify none
    server fastapi YOUR_RENDER_WMS_URL:443 check inter 10s fall 3 rise 2 ssl verify none

# ─────────────────────────────────────────────────────────────
# DA Engine HTTPS (8001) — HTTP to Render DA Engine
# ─────────────────────────────────────────────────────────────
frontend da_engine_front
    mode http
    bind *:8001 ssl crt /etc/haproxy/certs/api.pem
    default_backend da_engine_back

backend da_engine_back
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request set-header X-Forwarded-Proto https
    # Replace YOUR_RENDER_DA_URL with your actual Render DA Engine URL
    # e.g., server da-engine your-da-engine.onrender.com:443 check ssl verify none
    server da-engine YOUR_RENDER_DA_URL:443 check inter 10s fall 3 rise 2 ssl verify none
