global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 10s
    timeout client  100s
    timeout server  100s

# MQTT SSL (8883) - TCP Pass-through (terminates at EMQX)
frontend mqtt_ssl_front
    bind *:8883
    mode tcp
    default_backend mqtt_ssl_back

backend mqtt_ssl_back
    mode tcp
    balance roundrobin
    server emqx1 emqx1:8883 check
    server emqx2 emqx2:8883 check
    server emqx3 emqx3:8883 check

# Dashboard SSL (18083) - terminates at HAProxy
frontend dashboard_front
    mode http
    bind *:18083 ssl crt /etc/haproxy/certs/api.pem
    default_backend dashboard_back

backend dashboard_back
    mode http
    balance roundrobin
    server emqx1 emqx1:18083 check
    server emqx2 emqx2:18083 check
    server emqx3 emqx3:18083 check

# FastAPI API HTTPS (443) - terminates at HAProxy
frontend api_https_front
    mode http
    bind *:443 ssl crt /etc/haproxy/certs/api.pem
    acl is_websocket hdr(Upgrade) -i websocket
    http-request set-header X-Forwarded-Proto https
    use_backend fastapi_backend if is_websocket
    default_backend fastapi_backend

backend fastapi_backend
    mode http
    balance roundrobin
    timeout tunnel 3600s
    timeout server 100s
    http-request set-header X-Forwarded-Proto https
    server fastapi fastapi:8000 check
